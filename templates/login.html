{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h1>Entrar</h1>
        <p class="muted">Acesse sua conta para agendar e gerenciar horários.</p>
        <form method="post" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>E-mail
                <input type="email" name="email" required autofocus>
            </label>
            <label>Senha
                <input type="password" name="senha" autocomplete="current-password" maxlength="128" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
